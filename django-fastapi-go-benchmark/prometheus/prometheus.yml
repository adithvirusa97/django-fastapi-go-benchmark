global:
  scrape_interval: 5s
scrape_configs:
  - job_name: django
    metrics_path: /metrics
    static_configs: [{targets: ['django:8000']}]
  - job_name: fastapi
    metrics_path: /metrics
    static_configs: [{targets: ['fastapi:8000']}]
  - job_name: fastapi-granian
    metrics_path: /metrics
    static_configs: [{targets: ['fastapi-granian:8000']}]
  - job_name: golang
    metrics_path: /metrics
    static_configs: [{targets: ['golang:8000']}]
